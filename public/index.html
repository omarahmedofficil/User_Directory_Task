<!-- Main Frontend Page - Defines the User Directory layout and loads application assets -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>User Directory</title>
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="" id="brand-link" class="app-header__brand" data-link>
        <span class="app-header__title">User Directory</span>
      </a>
      <div class="search-wrap">
        <svg class="search-wrap__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="search-input" class="search-input" type="search" placeholder="Search by name, job title, or department..." />
      </div>
    </div>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">Built with PHP, HTML5 &amp; MySQL - By: Omar Ahmed.</footer>

  <div id="global-loading-bar" class="global-loading-bar"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
